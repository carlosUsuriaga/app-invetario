<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimientos de Inventario</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2rem;
        min-height: 100vh;
    }
    /* Header1 */
.header1 {
    margin-bottom: 2rem;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.25rem;
    background: var(--white);
    color: var(--gray-700);
    text-decoration: none;
    border-radius: var(--radius-md);
    font-weight: 500;
    font-size: 0.95rem;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
    margin-bottom: 1.5rem;
}

.back-btn:hover {
    background: var(--gray-50);
    transform: translateX(-4px);
    box-shadow: var(--shadow-md);
}
    .container {
        max-width: 1600px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        padding: 2rem;
    }

    h1 {
        color: #667eea;
        margin-bottom: 0.5rem;
        font-size: 2rem;
    }

    .subtitle {
        color: #6b7280;
        margin-bottom: 2rem;
    }

    /* Formulario */
    .form-section {
        background: #f9fafb;
        padding: 1.5rem;
        border-radius: 8px;
        margin-bottom: 2rem;
        border: 2px solid #e5e7eb;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    label {
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #374151;
        font-size: 0.9rem;
    }

    input, select, textarea {
        padding: 0.75rem;
        border: 2px solid #e5e7eb;
        border-radius: 6px;
        font-size: 0.95rem;
        transition: all 0.3s;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .error {
        color: #ef4444;
        font-size: 0.85rem;
        margin-top: 0.25rem;
    }

    .error-message {
        background: #fee2e2;
        color: #991b1b;
        padding: 1rem;
        border-radius: 6px;
        margin-bottom: 1rem;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.95rem;
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
        background: #e5e7eb;
        color: #374151;
    }

    .btn-secondary:hover {
        background: #d1d5db;
    }

    /* Filtros */
    .filters {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        align-items: center;
    }

    .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .filter-group label {
        margin: 0;
        font-size: 0.9rem;
    }

    .filter-group select,
    .filter-group input {
        padding: 0.5rem;
        width: auto;
    }

    /* Tabla */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
    }

    thead {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    th, td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
    }

    tbody tr:hover {
        background: #f9fafb;
    }

    .badge {
        display: inline-block;
        padding: 0.375rem 0.75rem;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 600;
    }

    .badge-entrada {
        background: #d1fae5;
        color: #065f46;
    }

    .badge-salida {
        background: #fee2e2;
        color: #991b1b;
    }

    .producto-info {
        font-weight: 500;
        color: #667eea;
    }

    @media (max-width: 768px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .filters {
            flex-direction: column;
            align-items: stretch;
        }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header1">
    <a th:href="@{/dashboard}" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Volver
    </a>
  </div>


  <h1>📦 Movimientos de Inventario</h1>
  <p class="subtitle">Registra entradas y salidas de productos</p>

  <!-- Mensaje de Error -->
  <div th:if="${error}" class="error-message" th:text="${error}"></div>

  <!-- Formulario de Registro -->
  <div class="form-section">
    <h3 style="margin-bottom: 1rem; color: #374151;">Registrar Movimiento</h3>

    <form th:action="@{/movimientos/registrar}" method="post" th:object="${movimiento}">
      <input type="hidden" th:field="*{idMovimiento}">

      <div class="form-grid">
        <div class="form-group">
          <label>Producto *</label>
          <select th:field="*{producto.idProducto}" id="producto">
            <option value="">Seleccione un producto</option>
            <option th:each="p : ${productos}"
                    th:value="${p.idProducto}"
                    th:text="${p.nombre + ' (Stock: ' + p.stockActual + ')'}"></option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('producto')}" th:errors="*{producto}"></span>
        </div>

        <div class="form-group">
          <label>Tipo de Movimiento *</label>
          <select th:field="*{tipo}" id="tipo">
            <option value="">Seleccione tipo</option>
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
        </div>

        <div class="form-group">
          <label>Cantidad *</label>
          <input type="number" th:field="*{cantidad}" id="cantidad" min="1">
          <span class="error" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></span>
        </div>

        <div class="form-group">
          <label>Motivo *</label>
          <input type="text" th:field="*{motivo}" id="motivo" placeholder="Ej: Compra, Venta, Ajuste">
          <span class="error" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></span>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1rem;">
        <label>Observación</label>
        <textarea th:field="*{observacion}" id="observacion" rows="2" placeholder="Observaciones adicionales (opcional)"></textarea>
      </div>

      <div style="display: flex; gap: 1rem;">
        <button type="submit" class="btn btn-primary" id="btnSubmit">Registrar Movimiento</button>
        <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Cancelar</button>
      </div>
    </form>
  </div>

  <!-- Filtros -->
  <div class="filters">
    <h3 style="color: #374151; margin-right: auto;">Historial de Movimientos</h3>

    <div class="filter-group">
      <label>Tipo:</label>
      <select id="filtroTipo" onchange="filtrarTabla()">
        <option value="">Todos</option>
        <option value="ENTRADA">Entradas</option>
        <option value="SALIDA">Salidas</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Desde:</label>
      <input type="date" id="filtroFechaInicio" onchange="filtrarTabla()">
    </div>

    <div class="filter-group">
      <label>Hasta:</label>
      <input type="date" id="filtroFechaFin" onchange="filtrarTabla()">
    </div>

    <button class="btn btn-secondary" onclick="limpiarFiltros()">Limpiar Filtros</button>
  </div>

  <!-- Tabla -->
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Producto</th>
      <th>Tipo</th>
      <th>Cantidad</th>
      <th>Motivo</th>
      <th>Observación</th>
      <th>Fecha</th>
      <th>Accciones</th>
    </tr>
    </thead>
    <tbody id="tabla-body">
    <tr th:each="m : ${movimientos}"
        th:data-tipo="${m.tipo}"
        th:data-fecha="${m.fechaRegistro}">
      <td th:text="${m.idMovimiento}"></td>
      <td class="producto-info" th:text="${m.producto.nombre}"></td>
      <td>
                    <span th:class="${m.tipo == T(ida.pe.Invetario.enums.TipoMovimiento).ENTRADA ? 'badge badge-entrada' : 'badge badge-salida'}"
                          th:text="${m.tipo}"></span>
      </td>
      <td th:text="${m.cantidad}"></td>
      <td th:text="${m.motivo}"></td>
      <td th:text="${m.observacion != null ? m.observacion : '-'}"></td>
      <td th:text="${#temporals.format(m.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
      <td>
        <!-- 🔥 Botón de anular -->
        <a th:href="@{/movimientos/anular/{id}(id=${m.idMovimiento})}"
           class="btn-anular"
           onclick="return confirm('⚠️ ¿Estás seguro de ANULAR este movimiento? Se revertirá el stock del producto.')">
          🗑️ Anular
        </a>
      </td>

    </tr>
    </tbody>
  </table>
</div>

<script>
  // Limpiar formulario
  function limpiarFormulario() {
      document.getElementById('producto').value = '';
      document.getElementById('tipo').value = '';
      document.getElementById('cantidad').value = '';
      document.getElementById('motivo').value = '';
      document.getElementById('observacion').value = '';
  }

  // Filtrar tabla
  function filtrarTabla() {
      const filtroTipo = document.getElementById('filtroTipo').value;
      const filtroFechaInicio = document.getElementById('filtroFechaInicio').value;
      const filtroFechaFin = document.getElementById('filtroFechaFin').value;

      const filas = document.querySelectorAll('#tabla-body tr');

      filas.forEach(fila => {
          let mostrar = true;

          // Filtro por tipo
          if (filtroTipo && fila.dataset.tipo !== filtroTipo) {
              mostrar = false;
          }

          // Filtro por fecha
          if (filtroFechaInicio || filtroFechaFin) {
              const fechaMovimiento = new Date(fila.dataset.fecha);

              if (filtroFechaInicio) {
                  const fechaInicio = new Date(filtroFechaInicio);
                  if (fechaMovimiento < fechaInicio) mostrar = false;
              }

              if (filtroFechaFin) {
                  const fechaFin = new Date(filtroFechaFin);
                  fechaFin.setHours(23, 59, 59);
                  if (fechaMovimiento > fechaFin) mostrar = false;
              }
          }

          fila.style.display = mostrar ? '' : 'none';
      });
  }

  // Limpiar filtros
  function limpiarFiltros() {
      document.getElementById('filtroTipo').value = '';
      document.getElementById('filtroFechaInicio').value = '';
      document.getElementById('filtroFechaFin').value = '';
      filtrarTabla();
  }
</script>

</body>
</html>
