<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Unidad de Medida</title>
    <link rel="stylesheet" th:href="@{/UnidadMedida/unidadMdiseñoF.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <a th:href="@{/dashboard}" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver
        </a>
        <div class="header-content">
            <h1 class="title">Agregar Unidad de Medida</h1>
            <p class="subtitle">Complete los datos para crear una nueva unidad de medida</p>
        </div>
    </div>

    <div class="card">
        <form th:action="@{/unidadmedida/agregar}" th:object="${unidadmedida}" method="post" class="form">

            <div class="form-group">
                <label for="nombre" class="form-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                    Nombre
                </label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-input" placeholder="Ej: kilogramo, litro, unidad" />
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>

            <div class="form-group">
                <label for="abreviatura" class="form-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    Abreviatura
                </label>
                <input type="text" id="abreviatura" th:field="*{abreviatura}" class="form-input" placeholder="Ej: kg, L, u, m" maxlength="10" />
                <span class="input-help">Máximo 10 caracteres</span>
                <span class="error" th:if="${#fields.hasErrors('abreviatura')}" th:errors="*{abreviatura}"></span>
            </div>

            <div class="form-group">
                <label for="estado" class="form-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Estado
                </label>
                <select id="estado" th:field="*{estado}" class="form-select">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <div class="btn-group">
                <a th:href="@{/unidadmedida/lista}" class="btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Guardar Unidad
                </button>
            </div>

        </form>
    </div>

    <!-- Info Box -->
    <div class="info-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <div>
            <strong>Ejemplos comunes:</strong>
            <p>Masa: kg, g, mg | Volumen: L, mL | Longitud: m, cm, mm | Cantidad: u (unidad), pza (pieza)</p>
        </div>
    </div>
</div>
</body>
</html>
