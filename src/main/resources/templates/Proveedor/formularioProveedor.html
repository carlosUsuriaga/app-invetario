<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Proveedor</title>
    <link rel="stylesheet" th:href="@{/Proveedor/form.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <a th:href="@{/dashboard}" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Volver
        </a>
        <div class="header-content">
            <h1 class="title">Agregar Proveedor</h1>
            <p class="subtitle">Complete los datos para registrar un nuevo proveedor</p>
        </div>
    </div>

    <div class="card">
        <form th:action="@{/proveedor/agregar}" th:object="${proveedor}" method="post" class="form">

            <div class="form-row">
                <div class="form-group">
                    <label for="nombre" class="form-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        Nombre
                    </label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-input" placeholder="Ej: Distribuidora ABC S.A.C." />
                    <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </div>

                <div class="form-group">
                    <label for="ruc" class="form-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="M7 15h0M12 15h0M17 15h0M7 11h10"></path>
                        </svg>
                        RUC
                    </label>
                    <input type="text" id="ruc" th:field="*{ruc}" class="form-input" placeholder="Ej: 20123456789" maxlength="11" />
                    <span class="error" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telefono" class="form-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        Teléfono
                    </label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-input" placeholder="Ej: 987654321" />
                    <span class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
                </div>

                <div class="form-group">
                    <label for="correo" class="form-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        Correo
                    </label>
                    <input type="email" id="correo" th:field="*{correo}" class="form-input" placeholder="Ej: proveedor@empresa.com" />
                    <span class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="direccion" class="form-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Dirección
                </label>
                <input type="text" id="direccion" th:field="*{direccion}" class="form-input" placeholder="Ej: Av. Principal 123, Lima" />
                <span class="error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></span>
            </div>

            <div class="form-group">
                <label for="estado" class="form-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    Estado
                </label>
                <select id="estado" th:field="*{estado}" class="form-select">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <div class="btn-group">
                <a th:href="@{/proveedor/lista}" class="btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Crear Proveedor
                </button>
            </div>

        </form>
    </div>

    <!-- Info Box -->
    <div class="info-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <div>
            <strong>Información importante:</strong>
            <p>El RUC debe tener 11 dígitos. Asegúrese de ingresar datos válidos para facilitar el contacto con el proveedor.</p>
        </div>
    </div>
</div>
</body>
</html>
